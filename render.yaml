services:
  - type: web
    name: ai-assisted-ticket-triage-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Restrict to *our* Render frontend specifically. The previous wildcard
      # (^https://.*\.onrender\.com$) accepted any Render-hosted site, which
      # lets an unrelated Render app's frontend invoke this API.
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://ai-assisted-ticket-triage-frontend(-[a-z0-9]+)?\.onrender\.com$
      - key: LITELLM_API_BASE
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: LITELLM_MODEL
        value: azure_ai/gpt-oss-120b
      - key: ADMIN_API_KEY
        generateValue: true
      # Postgres lives on Neon (https://neon.tech), not on Render — the Render
      # free-tier Postgres expires after 90 days. Set DATABASE_URL manually
      # in the Render dashboard to the Neon connection string. Format:
      #   postgresql://user:pass@<host>.neon.tech/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false

  - type: web
    name: ai-assisted-ticket-triage-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
